<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 46" width="390" height="46" preserveAspectRatio="xMidYMax slice">
<!-- v3568 (propriétaire) : filet or du haut et reflet retirés (rien qui attire l'œil). v3566 (propriétaire) : planètes et étoile brillante retirées, seules de minuscules étoiles. v3565 : filet or qui s'efface sur les côtés + léger reflet au centre (plus luxueux). v3564 (propriétaire : « essaie le jaune, un peu plus foncé, léger ») : bas de l'appli iPhone — univers or sombre, peu d'étoiles,
     deux petites planètes discrètes, OROLADO une seule fois. -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#060503"/><stop offset=".6" stop-color="#120D05"/><stop offset="1" stop-color="#1E1507"/></linearGradient>
<radialGradient id="n1" cx="50%" cy="150%" r="60%"><stop offset="0" stop-color="#8A6418" stop-opacity=".45"/><stop offset="1" stop-color="#8A6418" stop-opacity="0"/></radialGradient>
<radialGradient id="n2" cx="12%" cy="140%" r="40%"><stop offset="0" stop-color="#6B4A12" stop-opacity=".35"/><stop offset="1" stop-color="#6B4A12" stop-opacity="0"/></radialGradient>
<radialGradient id="n3" cx="88%" cy="140%" r="40%"><stop offset="0" stop-color="#6B4A12" stop-opacity=".35"/><stop offset="1" stop-color="#6B4A12" stop-opacity="0"/></radialGradient>
<linearGradient id="tx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3DFA6"/><stop offset="1" stop-color="#B8913A"/></linearGradient>
<radialGradient id="p1" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#E9C77A"/><stop offset=".55" stop-color="#9A6E22"/><stop offset="1" stop-color="#3A2808"/></radialGradient>
<radialGradient id="p2" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#D8C9A8"/><stop offset=".6" stop-color="#7A6440"/><stop offset="1" stop-color="#2A200E"/></radialGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B8913A" stop-opacity="0"/><stop offset=".3" stop-color="#D4AF37" stop-opacity=".55"/><stop offset=".5" stop-color="#F3DFA6" stop-opacity=".9"/><stop offset=".7" stop-color="#D4AF37" stop-opacity=".55"/><stop offset="1" stop-color="#B8913A" stop-opacity="0"/></linearGradient>
<radialGradient id="sh" cx="50%" cy="0%" r="50%"><stop offset="0" stop-color="#F3DFA6" stop-opacity=".14"/><stop offset="1" stop-color="#F3DFA6" stop-opacity="0"/></radialGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFF6D8" stop-opacity=".95"/><stop offset=".35" stop-color="#E9C77A" stop-opacity=".45"/><stop offset="1" stop-color="#E9C77A" stop-opacity="0"/></radialGradient>
</defs>
<rect width="390" height="46" fill="url(#bg)"/>
<rect width="390" height="46" fill="url(#n1)"/><rect width="390" height="46" fill="url(#n2)"/><rect width="390" height="46" fill="url(#n3)"/>


<g fill="#F5E6C0"><circle cx="64" cy="30" r=".5" opacity=".5"/><circle cx="103" cy="12" r=".55" opacity=".55"/><circle cx="142" cy="33" r=".5" opacity=".45"/>
<circle cx="252" cy="34" r=".5" opacity=".45"/><circle cx="292" cy="11" r=".55" opacity=".55"/><circle cx="331" cy="31" r=".5" opacity=".5"/></g>
<text x="195" y="23" text-anchor="middle" font-family="Plus Jakarta Sans, Montserrat, Helvetica, Arial, sans-serif" font-weight="800" font-size="9.5" letter-spacing="4.2" fill="url(#tx)" fill-opacity=".85">OROLADO</text>
</svg>
