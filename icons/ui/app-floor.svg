<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 46" width="390" height="46" preserveAspectRatio="xMidYMax slice">
<!-- v3563 (propriétaire, style « B » tout violet) : bas de l'appli iPhone — univers violet, quelques étoiles, OROLADO une seule fois. -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07040E"/><stop offset=".55" stop-color="#140A28"/><stop offset="1" stop-color="#22103F"/></linearGradient>
<radialGradient id="n1" cx="18%" cy="130%" r="55%"><stop offset="0" stop-color="#7C3AED" stop-opacity=".55"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
<radialGradient id="n2" cx="84%" cy="125%" r="50%"><stop offset="0" stop-color="#A855F7" stop-opacity=".45"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
<radialGradient id="n3" cx="50%" cy="150%" r="45%"><stop offset="0" stop-color="#C084FC" stop-opacity=".30"/><stop offset="1" stop-color="#C084FC" stop-opacity="0"/></radialGradient>
<linearGradient id="tx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5EDFF"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".35" stop-color="#DDD6FE" stop-opacity=".5"/><stop offset="1" stop-color="#DDD6FE" stop-opacity="0"/></radialGradient>
</defs>
<rect width="390" height="46" fill="url(#bg)"/>
<rect width="390" height="46" fill="url(#n1)"/>
<rect width="390" height="46" fill="url(#n2)"/>
<rect width="390" height="46" fill="url(#n3)"/>
<line x1="0" y1="0.5" x2="390" y2="0.5" stroke="#A78BFA" stroke-opacity=".35" stroke-width="1"/>
<g fill="#fff">
<circle cx="22" cy="14" r=".7" opacity=".75"/><circle cx="64" cy="30" r=".5" opacity=".5"/><circle cx="103" cy="12" r=".6" opacity=".6"/>
<circle cx="292" cy="11" r=".6" opacity=".6"/><circle cx="331" cy="31" r=".5" opacity=".5"/><circle cx="372" cy="15" r=".7" opacity=".75"/>
</g>
<g fill="#E9D5FF"><circle cx="142" cy="33" r=".55" opacity=".6"/><circle cx="252" cy="34" r=".55" opacity=".6"/></g>
<!-- deux étoiles qui brillent -->
<circle cx="44" cy="22" r="3.2" fill="url(#glow)"/><path d="M44 18.4v7.2M40.4 22h7.2" stroke="#fff" stroke-width=".5" stroke-opacity=".9"/>
<circle cx="350" cy="25" r="2.8" fill="url(#glow)"/><path d="M350 21.8v6.4M346.8 25h6.4" stroke="#fff" stroke-width=".5" stroke-opacity=".85"/>
<text x="195" y="23" text-anchor="middle" font-family="Plus Jakarta Sans, Montserrat, Helvetica, Arial, sans-serif" font-weight="800" font-size="9.5" letter-spacing="4.2" fill="url(#tx)" fill-opacity=".9">OROLADO</text>
</svg>
