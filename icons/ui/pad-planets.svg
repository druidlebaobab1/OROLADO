<circle cx="370" cy="15" r=".6" fill="#fff" opacity=".5"/>
<circle cx="50" cy="90" r=".6" fill="#fff" opacity=".3"/>
<circle cx="190" cy="100" r=".7" fill="#fff" opacity=".4"/>
<circle cx="350" cy="85" r=".8" fill="#fff" opacity=".3"/>
<circle cx="260" cy="70" r=".5" fill="#fff" opacity=".4"/>
