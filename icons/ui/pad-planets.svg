<!-- Stars background -->
<circle cx="20" cy="30" r=".8" fill="#fff" opacity=".5"/>
<circle cx="80" cy="10" r=".6" fill="#fff" opacity=".4"/>
<circle cx="150" cy="50" r=".9" fill="#fff" opacity=".6"/>
<circle cx="230" cy="20" r=".7" fill="#fff" opacity=".5"/>
