<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- OROLADO — Pyramide Royale : pyramide égyptienne en or, pierre de faîte lumineuse avec un œil discret. -->
  <defs>
    <radialGradient id="bgA" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1A2338"/>
      <stop offset=".6" stop-color="#0E1424"/>
      <stop offset="1" stop-color="#070B15"/>
    </radialGradient>
    <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset=".5" stop-color="#E0A92E"/>
      <stop offset="1" stop-color="#8A5A12"/>
    </linearGradient>
    <linearGradient id="faceL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1BF"/>
      <stop offset=".35" stop-color="#F6C94D"/>
      <stop offset="1" stop-color="#C98A12"/>
    </linearGradient>
    <linearGradient id="faceR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8780C"/>
      <stop offset=".55" stop-color="#8E5808"/>
      <stop offset="1" stop-color="#5E3A06"/>
    </linearGradient>
    <linearGradient id="capL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFBEA"/>
      <stop offset="1" stop-color="#FFD76A"/>
    </linearGradient>
    <linearGradient id="capR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2B233"/>
      <stop offset="1" stop-color="#C98410"/>
    </linearGradient>
    <radialGradient id="haloA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF6D0" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#FFD35A" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FFB300" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clipL"><path d="M256 60 L114 422 L256 422 Z"/></clipPath>
    <clipPath id="clipR"><path d="M256 60 L256 422 L398 422 Z"/></clipPath>
    <linearGradient id="banA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset=".45" stop-color="#F6C94D"/>
      <stop offset="1" stop-color="#C98A12"/>
    </linearGradient>
  <linearGradient id="faceU" x1="0" y1="0" x2="1" y2="0.25"><stop offset="0" stop-color="#FFF1BF"/><stop offset=".35" stop-color="#F6C94D"/><stop offset=".7" stop-color="#D59318"/><stop offset="1" stop-color="#9A620A"/></linearGradient></defs>
  <circle cx="256" cy="262" r="248" fill="url(#bgA)"/>
  <!-- halo derrière la pierre de faîte -->
  <circle cx="256" cy="74" r="54" fill="url(#haloA)" opacity=".55"/>
  <!-- corps de la pyramide (2 faces) -->
  <path d="M256 60 L114 422 L398 422 Z" fill="url(#faceU)"/>
  
  <!-- assises de pierre (lignes fines) -->
  <g clip-path="url(#clipL)" stroke="#8A5A10" stroke-opacity=".35" stroke-width="3">
    <path d="M100 224 H260 M100 280 H260 M100 336 H260"/>
  </g>
  <g clip-path="url(#clipR)" stroke="#2E1C03" stroke-opacity=".35" stroke-width="3">
    <path d="M252 224 H412 M252 280 H412 M252 336 H412"/>
  </g>
  <!-- arête lumineuse -->
  
  <!-- pierre de faîte flottante -->
  
  
  <!-- œil discret (fin trait doré, pupille lumineuse) -->
  
  
  
  <!-- pièce crypto crantée -->
  <circle cx="256" cy="262" r="200" fill="none" stroke="url(#ringA)" stroke-width="10" stroke-dasharray="6 9" opacity=".7"/>
  <circle cx="256" cy="262" r="186" fill="none" stroke="#E6B23A" stroke-opacity=".3" stroke-width="2.5"/>
  <rect x="100" y="408" width="312" height="60" rx="30" fill="url(#banA)" stroke="#8A5A12" stroke-opacity=".9" stroke-width="3"/>
  <rect x="108" y="413" width="296" height="22" rx="11" fill="#FFF6D6" fill-opacity=".28"/>
  <text x="259" y="451" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="38" letter-spacing="7" fill="#3A2205" text-anchor="middle" text-rendering="geometricPrecision">OROLADO</text>
  <!-- sol -->
  
</svg>
