<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 72" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="bgFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060C" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E3A5F" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#2A4C72" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#3A6E7A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#1E3A5F" stop-opacity="0"/>
