<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 120" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="bgFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#03040A" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#05070F" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="neb" cx="50%" cy="110%" r="75%">
      <stop offset="0" stop-color="#1B2A4A" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#121D33" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#05070F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pl1" cx="36%" cy="30%" r="80%">
      <stop offset="0" stop-color="#3A4F72"/>
      <stop offset="0.5" stop-color="#1A2740"/>
      <stop offset="1" stop-color="#070B16"/>
    </radialGradient>
    <radialGradient id="pl1Rim" cx="30%" cy="22%" r="60%">
      <stop offset="0" stop-color="#8FB4E6" stop-opacity="0.85"/>
      <stop offset="0.25" stop-color="#8FB4E6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pl2" cx="38%" cy="32%" r="80%">
      <stop offset="0" stop-color="#5A4A6E"/>
      <stop offset="0.55" stop-color="#2A2038"/>
      <stop offset="1" stop-color="#0A0712"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9FB6D8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9FB6D8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9FB6D8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="390" height="120" fill="url(#bgFade)"/>
  <rect x="0" y="20" width="390" height="100" fill="url(#neb)"/>
  <!-- étoiles -->
  <g fill="#FFFFFF">
    <circle cx="24" cy="30" r="0.9" opacity="0.8"/>
    <circle cx="70" cy="52" r="0.7" opacity="0.6"/>
    <circle cx="118" cy="26" r="1" opacity="0.9"/>
    <circle cx="150" cy="60" r="0.6" opacity="0.5"/>
    <circle cx="205" cy="34" r="0.8" opacity="0.7"/>
    <circle cx="250" cy="22" r="0.7" opacity="0.6"/>
    <circle cx="300" cy="48" r="0.9" opacity="0.8"/>
    <circle cx="340" cy="30" r="0.7" opacity="0.6"/>
    <circle cx="368" cy="58" r="1" opacity="0.85"/>
    <circle cx="44" cy="70" r="0.6" opacity="0.45"/>
    <circle cx="178" cy="80" r="0.6" opacity="0.4"/>
    <circle cx="276" cy="74" r="0.6" opacity="0.45"/>
  </g>
  <!-- grande planète sombre, bas-gauche, liseré froid -->
  <g>
    <circle cx="66" cy="128" r="58" fill="url(#pl1)"/>
    <circle cx="66" cy="128" r="58" fill="url(#pl1Rim)"/>
    <ellipse cx="52" cy="112" rx="40" ry="10" fill="#0B1222" opacity="0.4"/>
  </g>
  <!-- petite planète à anneau, droite -->
  <g transform="translate(322 96)">
    <ellipse cx="0" cy="0" rx="34" ry="8" fill="url(#ring)" transform="rotate(-16)"/>
    <circle cx="0" cy="0" r="17" fill="url(#pl2)"/>
    <ellipse cx="0" cy="0" rx="34" ry="8" fill="none" stroke="url(#ring)" stroke-width="1.4" transform="rotate(-16)" opacity="0.5"/>
  </g>
  <!-- lune lointaine -->
  <circle cx="196" cy="70" r="7" fill="#223049"/>
  <circle cx="193" cy="67" r="7" fill="#05070F"/>
</svg>
