# OROLADO — sites annexes (fichiers simples, aucun PHP, aucune base de données) :
#   orolado.org  → sites/outils    (OROLADO Tools : prédiction + calculateurs)
#   orolado.net  → sites/academie  (OROLADO Academy : leçons + lexique)
#   orolad0.com  → sites/quiz      (Quiz du Trader)
# Installé par serveur-direct/vps/sites-annexes.sh (ne touche pas au site principal).

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  ssl_certificate     /etc/ssl/orolado/origin.pem;
  ssl_certificate_key /etc/ssl/orolado/origin.key;
  server_name orolado.org www.orolado.org;
  if ($host = www.orolado.org) { return 301 https://orolado.org$request_uri; }
  root /var/www/orolado/sites/outils;
  include /var/www/orolado/serveur-direct/vps/nginx-sites-commun.inc;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  ssl_certificate     /etc/ssl/orolado/origin.pem;
  ssl_certificate_key /etc/ssl/orolado/origin.key;
  server_name orolado.net www.orolado.net;
  if ($host = www.orolado.net) { return 301 https://orolado.net$request_uri; }
  root /var/www/orolado/sites/academie;
  include /var/www/orolado/serveur-direct/vps/nginx-sites-commun.inc;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  ssl_certificate     /etc/ssl/orolado/origin.pem;
  ssl_certificate_key /etc/ssl/orolado/origin.key;
  server_name orolad0.com www.orolad0.com;
  if ($host = www.orolad0.com) { return 301 https://orolad0.com$request_uri; }
  root /var/www/orolado/sites/quiz;
  include /var/www/orolado/serveur-direct/vps/nginx-sites-commun.inc;
}

# v2617 — orolado.app : ancienne adresse → redirection définitive (301), Google remplace l'adresse dans ses résultats.
# La page de présentation (/decouvrir/) part vers orolado.online (sa vraie adresse), tout le reste vers www.orolado.com.
server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  ssl_certificate     /etc/ssl/orolado/origin.pem;
  ssl_certificate_key /etc/ssl/orolado/origin.key;
  server_name orolado.app www.orolado.app;
  location ^~ /decouvrir/ { return 301 https://orolado.online$request_uri; }
  location / { return 301 https://www.orolado.com$request_uri; }
}