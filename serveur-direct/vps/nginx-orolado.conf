# OROLADO — nginx sur le VPS (remplace les .htaccess d'Hostinger : mêmes règles).
# Copié dans /etc/nginx/sites-available/orolado par serveur-direct/vps/installer.sh

# Vraie adresse des joueurs derrière Cloudflare (liste refaite par installer.sh).
include /etc/nginx/cloudflare-ips.conf;
real_ip_header CF-Connecting-IP;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  listen 443 ssl http2 default_server;
  listen [::]:443 ssl http2 default_server;
  ssl_certificate     /etc/ssl/orolado/origin.pem;
  ssl_certificate_key /etc/ssl/orolado/origin.key;
  server_name orolado.com www.orolado.com _;

  root /var/www/orolado;
  index index.html;
  client_max_body_size 12m;
  autoindex off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json text/plain;

  # ---- Jamais servis sur internet (comme les .htaccess « Require all denied ») ----
  location ~ /\.                                                { return 404; }
  location ~ ^/(data|scripts|supabase|serveur-direct|_maquette|_preview|maquettes)(/|$) { return 404; }
  location ~ (\.(sql|md|mdc|ps1|cs|csv|log|example|bak|sh)$|_lib\.php$|^/fair_table\.php$) { return 404; }

  # ---- Ligne directe des prix (WebSocket) → serveur-direct/direct.js ----
  location = /direct {
    proxy_pass http://127.0.0.1:8092;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
  # État de la ligne directe : seulement depuis le serveur lui-même.
  location ^~ /direct/ {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:8092;
  }

  # ---- Adresses courtes (même liste que .htaccess) ----
  rewrite ^/admin/?$                         /admin.php                    last;
  rewrite ^/api/maketou-webhook/?$           /api/maketou-webhook.php      last;
  rewrite ^/api/deposit/initiate/?$          /api/deposit-initiate.php     last;
  rewrite ^/api/deposit/confirm/?$           /api/deposit-confirm.php      last;
  rewrite ^/api/deposit/webhook/?$           /api/deposit-webhook.php      last;
  rewrite ^/api/deposit/verify-crypto/?$     /api/deposit-verify-crypto.php last;
  rewrite ^/api/oxapay/invoice/?$            /api/oxapay-invoice.php       last;
  rewrite ^/api/oxapay/status/?$             /api/oxapay-status.php        last;
  rewrite ^/api/oxapay/webhook/?$            /api/oxapay-webhook.php       last;
  rewrite ^/api/qr/?$                        /api/qr.php                   last;
  rewrite ^/api/flutterwave/checkout/?$      /api/flutterwave-checkout.php last;
  rewrite ^/api/flutterwave/charge/?$        /api/flutterwave-charge.php   last;
  rewrite ^/api/flutterwave/webhook/?$       /api/flutterwave-webhook.php  last;
  rewrite ^/api/flutterwave/callback/?$      /api/flutterwave-callback.php last;
  rewrite ^/api/flutterwave/status/?$        /api/flutterwave-status.php   last;
  rewrite ^/api/flutterwave/verify/?$        /api/flutterwave-verify.php   last;

  # ---- Fichier des prix (secours quand la ligne directe n'est pas là) ----
  location = /feedcache/live.js {
    add_header Cache-Control "public, max-age=30" always;
    add_header X-Content-Type-Options "nosniff" always;
    types { application/javascript js; }
  }
  location ^~ /feedcache/ {
    add_header Cache-Control "no-cache, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # ---- PHP ----
  location ~ \.php$ {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_read_timeout 120s;
  }

  # ---- Cache des fichiers (comme mod_expires / mod_headers) ----
  location ~* \.(html|htm)$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }
  location ~* \.js$ {
    add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location ~* \.css$ { expires 7d; }
  location ~* \.svg$ { expires 30d; }

  location / {
    try_files $uri $uri/ =404;
  }
}
