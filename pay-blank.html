<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>html,body{margin:0;background:#07080c;min-height:100%;}</style>
</head>
<body>
<script>
(function () {
  var ref = '';
  var params = {};
  try {
    var q = new URLSearchParams(location.search);
    ref = q.get('ref') || '';
    q.forEach(function (v, k) { params[String(k).slice(0, 40)] = String(v).slice(0, 200); });
  } catch (e) { ref = ''; }
  params.source = 'pay-blank';
  try { if (ref) localStorage.setItem('oro_dep_ref', ref); } catch (e1) {}
  try { if (ref) sessionStorage.setItem('oro_dep_ref', ref); } catch (e2) {}
  try {
    // Cette page n'est atteinte qu'après le parcours de paiement Maketou :
    // on transmet la référence et les paramètres reçus à l'onglet Orolado.
    if (window.opener) window.opener.postMessage({ orolado: 'deposit-done', ref: ref, params: params }, '*');
  } catch (e3) {}
  try { window.close(); } catch (e4) {}
})();
</script>
</body>
</html>
